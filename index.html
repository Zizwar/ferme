  <!-- SEO & Hreflang Tags -->
  <link rel="canonical" href="https://fermerevedenfance.com/">
  <link rel="alternate" hreflang="fr" href="https://fermerevedenfance.com/fr/">
  <link rel="alternate" hreflang="ar" href="https://fermerevedenfance.com/ar/">
  <link rel="alternate" hreflang="en" href="https://fermerevedenfance.com/en/">
  <link rel="alternate" hreflang="es" href="https://fermerevedenfance.com/es/">
  <link rel="alternate" hreflang="x-default" href="https://fermerevedenfance.com/">

  <!-- Smart Client-side language detection -->
  <script>
    (function() {
      var supportedLangs = ['fr', 'ar', 'en', 'es'];
      var chosenLang = 'fr';
      
      try {
        var saved = localStorage.getItem('user_preferred_lang');
        if (saved && supportedLangs.indexOf(saved) !== -1) {
          chosenLang = saved;
        } else {
          var browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
          if (browserLang.indexOf('ar') === 0) chosenLang = 'ar';
          else if (browserLang.indexOf('es') === 0) chosenLang = 'es';
          else if (browserLang.indexOf('en') === 0) chosenLang = 'en';
          else chosenLang = 'fr';
        }
      } catch (e) {
        chosenLang = 'fr';
      }

      window.location.replace('/' + chosenLang + '/');
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/fr">
</head>
